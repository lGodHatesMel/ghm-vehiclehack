<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vehicle Hacker viewfinder</title>
        <style>
            /* Drawn by sd-phone over the camera viewfinder, click-through. The Lua side pushes
               { locked, label } as the crosshair moves over a vehicle, and { miss } on a shutter with
               nothing in the middle. */
            html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
            .reticle {
                position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px;
                --c: rgba(255, 255, 255, 0.92);
            }
            .reticle i { position: absolute; width: 22px; height: 22px; border: 0 solid var(--c); transition: border-color 0.12s; }
            .reticle i:nth-child(1) { left: 0; top: 0; border-width: 2px 0 0 2px; }
            .reticle i:nth-child(2) { right: 0; top: 0; border-width: 2px 2px 0 0; }
            .reticle i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 2px 2px; }
            .reticle i:nth-child(4) { right: 0; bottom: 0; border-width: 0 2px 2px 0; }
            .reticle b { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--c); transition: background 0.12s; }
            .locked { --c: #3ecf73; }
            .miss { --c: #ef5b5b; animation: shake 0.28s; }
            .label {
                position: absolute; left: 50%; top: calc(50% + 64px); transform: translateX(-50%);
                padding: 3px 9px; border-radius: 3px; background: rgba(0, 0, 0, 0.6); color: #3ecf73;
                font: 600 12px/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.1em; text-transform: uppercase;
                white-space: nowrap; opacity: 0; transition: opacity 0.12s;
            }
            .locked + .label { opacity: 1; }
            @keyframes shake { 20% { transform: translateX(-4px); } 60% { transform: translateX(4px); } }
        </style>
    </head>
    <body>
        <div class="reticle" id="reticle"><i></i><i></i><i></i><i></i><b></b></div>
        <div class="label" id="label"></div>
        <script>
            var reticle = document.getElementById('reticle');
            var label = document.getElementById('label');
            window.addEventListener('message', function (event) {
                var m = event.data;
                if (!m || typeof m !== 'object') return;
                if (m.miss) {
                    reticle.classList.remove('miss');
                    void reticle.offsetWidth;
                    reticle.classList.add('miss');
                    return;
                }
                if (typeof m.locked === 'boolean') {
                    reticle.classList.toggle('locked', m.locked);
                    label.textContent = m.locked && m.label ? m.label : '';
                }
            });
        </script>
    </body>
</html>
